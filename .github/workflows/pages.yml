name: Docs

on:
  push:
    branches:
      - main
    # Everything the docs are built from. Keep in sync with .yardopts and the docs:pages task.
    # Tag pushes ignore this filter, so every release publishes its docs.
    paths:
      - 'lib/**'
      - 'guide/**'
      - 'yard/**'
      - README.md
      - CHANGELOG.md
      - DEVELOPMENT.md
      - LICENSE.txt
      - .yardopts
      - Rakefile
      - Gemfile
      - .github/workflows/pages.yml
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - name: Build the docs of main and every version tag
        run: bundle exec rake docs:pages
      # Replaces the gh-pages branch with a single commit of _site. GitHub Pages serves that branch.
      - name: Publish to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          touch .nojekyll
          git init --quiet --initial-branch gh-pages
          git add --all
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "Docs for ${GITHUB_REF_NAME} (${GITHUB_SHA})"
          git push --force --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
