name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}, RSpec ${{ matrix.rspec }}
    # Ruby head and RSpec betas are unreleased, their failures don't fail the build
    continue-on-error: ${{ matrix.ruby == 'head' || contains(matrix.rspec, 'beta') }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
          - head
        rspec:
          - '3'
        include:
          - ruby: '3.2'
            rspec: '4.0.0.beta1'
          - ruby: '4.0'
            rspec: '4.0.0.beta1'
    env:
      RSPEC_VERSION: ${{ matrix.rspec == '3' && '~> 3.0' || matrix.rspec }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake

  mysql:
    runs-on: ubuntu-latest
    name: ${{ matrix.server }} (${{ matrix.adapter }}, Ruby ${{ matrix.ruby }})
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported Ruby. The build job runs all of them.
        ruby:
          - '3.2'
          - '4.0'
        server:
          - mysql:8.4
          - mariadb:11.4
        adapter:
          - mysql2
          - trilogy
          - ruby-mysql
    env:
      RUBY_IMAGE: ruby:${{ matrix.ruby }}
      MYSQL_IMAGE: ${{ matrix.server }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run the specs against MySQL
        run: docker compose -f .devcontainer/compose.yml run --rm app sh -c "bundle install && bundle exec rake spec:${{ matrix.adapter }}"
      - name: Stop MySQL
        if: always()
        run: docker compose -f .devcontainer/compose.yml down --volumes

  postgres:
    runs-on: ubuntu-latest
    name: ${{ matrix.server }} (Ruby ${{ matrix.ruby }})
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported Ruby and PostgreSQL
        ruby:
          - '3.2'
          - '4.0'
        server:
          - postgres:15
          - postgres:18
    env:
      RUBY_IMAGE: ruby:${{ matrix.ruby }}
      POSTGRES_IMAGE: ${{ matrix.server }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run the specs against PostgreSQL
        run: docker compose -f .devcontainer/compose.yml run --rm app sh -c "bundle install && bundle exec rake spec:postgres"
      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f .devcontainer/compose.yml down --volumes
